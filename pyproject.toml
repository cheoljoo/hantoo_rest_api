[project]
name = "hantoo-rest-api"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "cheojoo", email = "cheoljoo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-auth>=2.62.0",
    "google-auth-oauthlib>=1.5.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "yfinance>=1.5.2",
]

[project.scripts]
hantoo-rest-api = "hantoo_rest_api:main"
hantoo-snapshot = "hantoo_rest_api.snapshot:main"
hantoo-gsheet-auth = "hantoo_rest_api.gsheet_auth:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "web",
]
